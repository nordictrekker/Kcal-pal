<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kcal pal — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #eee; }
        .card { border-color: #333 !important; }
      }
      .card {
        max-width: 22rem;
        margin: 1rem;
        padding: 2rem 1.5rem;
        border: 1px solid #ddd;
        border-radius: 1rem;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { font-size: 0.9rem; opacity: 0.7; margin: 0 0 1.25rem; }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size:2rem">🥣</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        kcal pal needs a connection to log and sync. Your data is safe — try
        again once you&rsquo;re back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
